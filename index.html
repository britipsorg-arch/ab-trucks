
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB TRUCK SIMULATOR</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    background: #101c30;
    padding: 18px;
    border-bottom: 3px solid #008cff;
}

h1 { color: #00aaff; margin: 0; }

#game {
    position: relative;
    width: 100%;
    height: 520px;
    overflow: hidden;
    background: linear-gradient(#79b9e8 0%, #c5e3f5 48%, #39743a 48%);
}

.road {
    position: absolute;
    bottom: 0;
    left: 15%;
    width: 70%;
    height: 100%;
    background: #383838;
    border-left: 7px solid white;
    border-right: 7px solid white;
}

.lane {
    position: absolute;
    left: 50%;
    top: 0;
    height: 100%;
    border-left: 5px dashed #f7dc48;
}

.truck {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    width: 105px;
    height: 160px;
    transition: left .12s;
}

.cabin {
    position: absolute;
    top: 0;
    left: 8px;
    width: 89px;
    height: 90px;
    background: #d71920;
    border: 4px solid #8b1015;
    border-radius: 15px 15px 5px 5px;
}

.window {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 57px;
    height: 32px;
    background: #8bd6f5;
    border: 3px solid #222;
    border-radius: 5px;
}

.grille {
    position: absolute;
    bottom: 8px;
    left: 20px;
    width: 42px;
    height: 28px;
    background: #252525;
    border: 3px solid silver;
}

.wheel {
    position: absolute;
    width: 18px;
    height: 34px;
    background: #111;
    border-radius: 5px;
}

.w1 { top: 35px; left: -3px; }
.w2 { top: 35px; right: -3px; }
.w3 { bottom: 4px; left: -3px; }
.w4 { bottom: 4px; right: -3px; }

.controls {
    padding: 20px;
}

button {
    background: #008cff;
    color: white;
    border: 0;
    border-radius: 9px;
    padding: 17px 28px;
    margin: 7px;
    font-size: 20px;
    cursor: pointer;
}

footer {
    padding: 15px;
    color: #aaa;
}
</style>
</head>

<body>

<header>
<h1>🚛 AB TRUCK SIMULATOR</h1>
<p>🅰️🅱️ AB GAMES</p>
</header>

<div id="game">
    <div class="road">
        <div class="lane"></div>
    </div>

    <div class="truck" id="truck">
        <div class="cabin">
            <div class="window"></div>
            <div class="grille"></div>
        </div>
        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
        <div class="wheel w3"></div>
        <div class="wheel w4"></div>
    </div>
</div>

<h3>SCANIA VERMELHA — PRONTA PARA VIAJAR</h3>

<div class="controls">
    <button onclick="move(-1)">⬅️</button>
    <button onclick="move(1)">➡️</button>
</div>

<footer>
AB GAMES © 2026 — Desafie seus limites.
</footer>

<script>
let position = 50;

function move(direction) {
    position += direction * 5;
    position = Math.max(23, Math.min(77, position));

    document.getElementById("truck").style.left =
        position + "%";
}
</script>

</body>
</html>
